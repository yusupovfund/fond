<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Переход…</title>
<style>body{font:16px system-ui,sans-serif;background:#f6f1ea;color:#3b2f27;display:grid;place-items:center;height:100vh;margin:0}
a{color:#c4602d}</style></head>
<body><p id="m">Открываем сайт…</p>
<script>
const m = document.getElementById("m");
const down = () => { m.innerHTML = "Сайт сейчас недоступен — компьютер с программой выключен или нет интернета. Попробуйте через пару минут."; };
// сайт работает за туннелем: при обрыве Wi-Fi он переподключается ~30 секунд — ждём до минуты, потом переходим
async function go(d, tries) {
  try {
    const r = await fetch(d.url + "/health?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) return location.replace(d.url + (location.hash || "/"));
  } catch (e) {}
  if (tries <= 0) return down();
  m.textContent = "Сайт переподключается, подождите…";
  setTimeout(() => go(d, tries - 1), 5000);
}
fetch("url.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(d => {
  if (!/^https:\/\/(?!api\.)[a-z0-9-]+\.trycloudflare\.com$/.test(d.url || "")) throw new Error("no url");
  go(d, 12);
}).catch(down);
</script></body></html>
